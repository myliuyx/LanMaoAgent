services:
  stock-api:
    image: stock-api:0.8.3
    build: .
    container_name: stock-api
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST:?请设置 DB_HOST 环境变量}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:?请设置 DB_NAME 环境变量}
      - DB_USER=${DB_USER:?请设置 DB_USER 环境变量}
      - DB_PASSWORD=${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s